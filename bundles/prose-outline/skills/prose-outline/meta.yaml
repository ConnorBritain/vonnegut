# Metadata for the prose-outline skill.
#
# Skills have no primitives/ entry — see CONTRIBUTING.md "Surfaces". A skill
# renders once; its portable form is the bundle's AGENTS.md. This file exists
# because the contract and an honest per-harness enforcement label are not
# optional for any surface.

name: prose-outline
kind: planner
surface: skill
bundle: prose-outline

# Why planner: it produces a plan whose success criteria are checkable — every
# claim has a slot, every unknown is a question, the scan's counts are what the
# critic reads — and it decomposes nothing it cannot check. It surfaces
# ambiguity instead of resolving it, which is the planner rule.

contract:
  read_only: false          # it writes ONE thing: an outline revision, on approval
  writes: project-outline-store
  clean_context: false      # no adversarial framing to protect; it proposes
  scope: brief-and-draft
  deterministic: partial    # scan, diff, store and proposal-check are scripts; the proposal is not
  verdict: null             # a plan, not a judgement

  denied_inputs:
    - the tell catalog, in any form
    - the corpus (voice is not this skill's question)
    - another identity's outlines

  refuses:
    - Filling an evidence slot with something plausible the brief did not supply
    - Inventing a thesis for an underspecified brief (thesis is null; open questions say what is missing)
    - Saving without the user's approval, or as a side effect of drafting or scanning
    - Picking an identity when the registry has several and no default
    - Judging whether the argument is good — prose-structure-critic owns that
    - Drafting prose from the outline — prose-draft owns that
    - Stating or implying who wrote a draft

  tools:
    - tools/outline-scan.mjs        # counts, with limits
    - tools/outline-diff.mjs        # by id, never by text
    - tools/outline-store.mjs       # approval-gated, three registry states
    - tools/proposal-check.mjs      # the skill's own promises, mechanically

harness:
  claude-code:
    enforcement: partial
    notes: >-
      Dispatcher-triggered from the description. The scripts are deterministic
      and the approval gate is a flag the script honours; that the model sets the
      flag only after a yes is a prompt rule, not a harness guarantee.
  cursor:
    enforcement: partial
    notes: >-
      Scripts and store behave identically. Skill dispatch is absent; invoke by name.
  codex:
    enforcement: partial
    notes: >-
      Same. Use the bundle's AGENTS.md block so the model runs the scan instead
      of describing structure by eye.
  agents-md:
    enforcement: advisory
    notes: >-
      The scripts port intact; the approval rule and the "no invented thesis"
      rule are prose. proposal-check.mjs turns the second into a check; run it.
