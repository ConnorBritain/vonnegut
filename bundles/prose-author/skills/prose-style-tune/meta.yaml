name: prose-style-tune
kind: planner
surface: skill
bundle: prose-author

contract:
  read_only: false
  writes: immutable-preference-revisions
  scope: independent-preferences-and-optional-profile
  clean_context: false
  deterministic: partial
  observed_profile_immutable: true
  direct_persistent_instruction: save-with-scope-version-and-undo-receipt
  inferred_preference: explicit-approval-required
  runtime: ../prose-draft/tools/prose-runtime.mjs
  denied_inputs:
    - catalog.json
  refuses:
    - ambiguous interpretation or scope
    - stale preference ancestry or observation-dependent binding
    - equally specific active preference conflicts
    - inferring unrelated preferences from an uncontrolled draft choice

harness:
  claude-code:
    enforcement: partial
    notes: >-
      Runtime enforces immutable history, digests, scope precedence and approval
      for inferred operations. Interpreting user meaning remains a host responsibility.
  codex:
    enforcement: partial
    notes: >-
      Same deterministic preference store and rules as Claude. Model dispatch uses
      authenticated CLI sessions; unsupported isolation is disclosed.
  cursor:
    enforcement: advisory
    notes: >-
      Preference tools work with Node. Draft comparisons require an implemented
      Claude or Codex adapter; no native Cursor adapter is claimed.
  agents-md:
    enforcement: advisory
    notes: >-
      Prompt-only hosts must invoke the tools for checked storage and compilation.
      Never hand-edit preference state as a substitute for an unavailable runtime.
